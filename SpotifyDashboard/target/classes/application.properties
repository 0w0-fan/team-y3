# =====================================================================
# 方向六 · “响度战争”与音乐物理属性变迁史
# 工程：SpotifyDashboard      配置：只保留本模块真正需要的项
# =====================================================================

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.application.name=spotify-dashboard

# ---------------------------------------------------------------- 数据源
# 库：spotify_db    表：spotify_tracks（28,351 行）
# 建表脚本：Desktop/数据分析可视化/spotify_tracks.sql
# 账号密码按本机 MySQL 填写；换机器只改这三行即可
spring.datasource.url=jdbc:mysql://localhost:3306/spotify_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=30000
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------- 连接池
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20

# 取连接最多等 3 秒。Druid 默认 maxWait=-1 是“永远等”，
# 库一挂接口就无限期挂住，前端 fetch 永不返回、大屏一直转圈。
# 设了超时才能让 GlobalExceptionHandler2 把结构化错误立刻返回。
spring.datasource.druid.max-wait=3000
spring.datasource.druid.connection-error-retry-attempts=0
spring.datasource.druid.break-after-acquire-failure=true
spring.datasource.druid.validation-query=SELECT 1

# ---------------------------------------------------------------- 序列化
# 值为 null 的字段不下发，前端 data 里少一堆 null
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------- 日志
logging.level.root=info
logging.level.new_com.spotify2=info
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-40logger{39} : %msg%n
