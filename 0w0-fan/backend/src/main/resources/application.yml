server:
  port: 8088
  address: 0.0.0.0
  tomcat:
    uri-encoding: UTF-8
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain
    min-response-size: 2048

spring:
  application:
    name: spotify-dashboard

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/spotify_dashboard?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: "123456"
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 15
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

  # 大屏是纯静态文件，直接从 0w0-fan/frontend 目录读：
  # 改完 CSS/JS 刷新浏览器即生效，不用重启后端、也不用重新打包。
  #
  # 这里列了多个候选路径，是因为「工作目录」会随启动方式变化：
  #   · IDEA 里直接跑 Spring Boot 运行配置 → 工作目录 = 仓库根 D:\Project\IDEA	eam-y3
  #   · 终端里 cd 到 backend 再 mvn spring-boot:run → 工作目录 = 0w0-fan/backend
  #   · java -jar target/spotify-dashboard.jar → 工作目录 = 启动时所在目录
  # Spring Boot 只会用存在的那个，找不到就跳过，所以多列几个不会出错。
  web:
    resources:
      static-locations:
        - file:../frontend/                # 工作目录 = 0w0-fan/backend
        - file:./frontend/                 # 工作目录 = 0w0-fan
        - file:../0w0-fan/frontend/        # 工作目录 = 仓库下的任意一层
        - file:0w0-fan/frontend/           # 工作目录 = 仓库根（IDEA 默认）
        - file:./0w0-fan/frontend/         # 同上，显式写法
        - file:team-y3/0w0-fan/frontend/   # 工作目录 = D:\Project\IDEA
        - classpath:/static/               # 兜底：以后若把前端打进 jar
      cache:
        period: 0

  mvc:
    static-path-pattern: /**

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-aliases-package: com.fan.spotify.entity,com.fan.spotify.dto

logging:
  level:
    root: info
    com.fan.spotify: info
    com.alibaba.druid: warn
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  charset:
    console: UTF-8
