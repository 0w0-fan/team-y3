# 应用服务 WEB 访问端口
server.port=8080

spring.thymeleaf.cache = false
spring.thymeleaf.encoding = UTF-8
spring.thymeleaf.mode = HTML5
spring.thymeleaf.prefix = classpath:/templates/
spring.thymeleaf.suffix = .html

# 配置国际化文件基础名
spring.messages.basename = i18n.login

# 数据库连接信息部分
#spring.datasource.url=jdbc:mysql://localhost:3306/springbootdata?serverTimezone=UTC%2B8
#Spotify数据分析可视化的MySQl数据库地址
spring.datasource.url=jdbc:mysql://localhost:3306/spotify_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#连接池基础参数配置
spring.datasource.type = com.alibaba.druid.pool.DruidDataSource
spring.datasource.initialSize=20
spring.datasource.minIdle=10
spring.datasource.maxActive=100

mybatis.configuration.map-underscore-to-camel-case=true

#配置MyBatis的xml配置文件路径
mybatis.mapper-locations=classpath:mapper/**/*.xml
#配置XML映射文件中指定的实体类的包路径
#mybatis.type-aliases-package=org.springboot.demo.pojo
mybatis-plus.type-aliases-package=org.springboot.demo.pojo

logging.level.org.springboot.demo.mapper=debug

# JPA配置：不让JPA修改已有表结构，只打印SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# PageHelper分页插件配置
pagehelper.helper-dialect=mysql
# 页码合理化：pageNum<1时查第1页，超过总页数时查最后一页
pagehelper.reasonable=true






