<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>商品列表</title>
  <style>
    .productList {
      display: flex;
      flex-wrap: wrap;
      justify-content: start;
      width: 1500px;
      margin: 0 auto;
    }
    .productList .product {
      width: 15%;
      height: 350px;
      margin-right: 1.6%;
      margin-top: 10px;
      /*预留位置，防止border占用位置导致移位*/
      border: 1px solid transparent;
      box-sizing: border-box;
      /*设置边框与商品之间的间隙，可随时调整*/
      padding: 3px;
      border-radius: 10px;
      /*避免放大时，内容溢出*/
      overflow: hidden;
    }
    .productList .product .productName {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      height: 20px;
    }
    .productList .product:hover {
      border: 1px solid red;
      border-radius: 10px;
      /*放大时放大至原来的倍率（1.02是放大2%）*/
      transform: scale(1.02);
    }
    .productList .product .productImg {
      width: 100%;
      border-radius: 10px;
    }
    .productList .productTag {
      height: 15px;
    }
    .productList .productPrice {
      color: red;
      font-weight: bold;
      font-size: 20px;
    }
    .productList .productSaleCount {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>
<div class="productList">
  <div class="product" th:each="product : ${products}">
    <img class="productImg" th:src="${product.productImg}" />
    <p class="productName" th:text="${product.productName}"></p>
    <p class="productTag" th:text="${product.productTag}"></p>
    <p>
      <span class="productPrice" th:text="'¥' + ${product.productPrice}"></span>
      <span class="productSaleCount" th:if="${product.productSaleCount != null}" th:text="|销量 ${product.productSaleCountText}|"></span>
    </p>
  </div>
</div>
</body>
</html>
